# Real-data noise audit + KNN comparison
source: outbrain
seed: 42
svd_dim: 64
subsample: null          # null = full corpus; set an int for quick runs

# CC used to produce embeddings / cluster scores
cc_epochs: 20
cc_num_clusters: 4
cc_aug: medium_http_aug

# KNN
knn_k: 20
instability_views: 5
ks: [50, 100, 200]

# run_knn_noise synthetic comparison
seeds: [42, 7, 123]
noise_rate: 0.10
noise_mode: symmetric
